limit_req_zone $binary_remote_addr zone=notes_login:10m rate=12r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 64k;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/login {
        limit_req zone=notes_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
    }

    location /api/ {
        proxy_pass http://backend:8000;
    }
}
